<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的动漫库 - 全栈练习</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="container">
    <h1>🎬 我的动漫库</h1>

    <div class="form-group">
        <input v-model="newAnime.title" placeholder="动漫名称 アニメの名前">
        <textarea v-model="newAnime.description" placeholder="简介"></textarea>
        <input type="number" v-model="newAnime.lovepoint" placeholder="喜爱度 (数字)">
        <button @click="addAnime">添加动漫</button>
    </div>

    <div class="anime-list">
        <h3>已收藏的动漫 (按喜爱度排序)</h3>
        <div v-if="animes.length === 0">暂无数据，快去添加吧！</div>

        <div v-for="item in animes" :key="item.id" class="anime-item">
            <div class="info-box">
                <strong>{{ item.title }}</strong>
                <span class="love-badge">❤️ {{ item.lovepoint }}</span>
                <p class="desc-text">{{ item.description || '这家伙很懒，什么都没写~' }}</p>
            </div>
            <button class="delete-btn" @click="deleteAnime(item.id)">删除</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="description.js"></script>

</body>
</html>
